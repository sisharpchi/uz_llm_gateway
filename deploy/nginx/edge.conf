worker_processes auto;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 5m;
    keepalive_timeout 65s;
    limit_req_zone $binary_remote_addr zone=payment_callbacks:10m rate=50r/s;
    limit_req_status 429;
    # Only an explicitly trusted load balancer may provide a client IP.
    include /etc/nginx/trusted-proxy-realip.conf;

    upstream uzllm_gateway {
        least_conn;
        server ${UZLLM_GATEWAY_A} max_fails=2 fail_timeout=10s;
        server ${UZLLM_GATEWAY_B} max_fails=2 fail_timeout=10s;
        keepalive 128;
    }
    upstream uzllm_management {
        least_conn;
        server ${UZLLM_MANAGEMENT_A} max_fails=2 fail_timeout=10s;
        server ${UZLLM_MANAGEMENT_B} max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        return 308 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /run/certs/public.crt;
        ssl_certificate_key /run/certs/public.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /edge/health { return 204; }

        location /v1/ {
            proxy_pass https://uzllm_gateway;
            proxy_ssl_server_name on;
            proxy_ssl_name gateway.internal;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/certs/internal-ca.crt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 660s;
            # A streamed POST may have reached the provider even if no response arrived.
            proxy_next_upstream off;
        }
        location /management/v1/ {
            proxy_pass https://uzllm_management;
            proxy_ssl_server_name on;
            proxy_ssl_name management.internal;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/certs/internal-ca.crt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            # Payment and management writes must be replayed only by their caller.
            proxy_next_upstream off;
        }
        location = /payments/payme/callback {
            if ($request_method != POST) { return 405; }
            client_max_body_size 32k;
            client_body_timeout 10s;
            limit_req zone=payment_callbacks burst=100 nodelay;
            proxy_pass https://uzllm_management;
            proxy_ssl_server_name on;
            proxy_ssl_name management.internal;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/certs/internal-ca.crt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
        }
        location = /payments/click/callback {
            if ($request_method != POST) { return 405; }
            # This file contains `deny all` until merchant-verified source ranges
            # are installed. CLICK's signed fields do not include `error`.
            include /etc/nginx/click-allowlist.conf;
            client_max_body_size 32k;
            client_body_timeout 10s;
            limit_req zone=payment_callbacks burst=100 nodelay;
            proxy_pass https://uzllm_management;
            proxy_ssl_server_name on;
            proxy_ssl_name management.internal;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/certs/internal-ca.crt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
        }
        location ^~ /payments/ { return 404; }
        location = /integrations/telegram/webhook {
            client_max_body_size 16k;
            proxy_pass https://uzllm_management;
            proxy_ssl_server_name on;
            proxy_ssl_name management.internal;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/certs/internal-ca.crt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
        }
        location = /admin { return 308 /admin/; }
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
        }
        location / {
            root /usr/share/nginx/html/dashboard;
            try_files $uri $uri/ /index.html;
        }
    }
}
